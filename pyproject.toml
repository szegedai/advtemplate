[project]
name = "advtemplate"
version = "0.1.0"
description = "Greedy search for set membership errors in LLMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "better-profanity==0.7.0",
    "en-core-web-sm",
    "numpy==1.26.4",
    "spacy==3.7.5",
    "torch==2.7.0",
    "transformers==5.3.0",
    "wordfreq==3.1.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }

[dependency-groups]
analysis = [
    "jupyter>=1.1.1",
    "matplotlib==3.10.1",
    "pandas==2.2.3",
    "scipy==1.15.2",
]
